[package]
name = "sheaf-app"
version = "0.1.0"
edition = "2021"

[dependencies]
sheaf-native = { path = "../sheaf-native" }
sheaf-runtime = { path = "../sheaf-runtime" }
sheaf-query = { path = "../sheaf-query" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlparser = { version = "=0.59.0", default-features = false, features = ["std"] }
blake3 = "1"

[features]
force-fallback = ["sheaf-native/force-fallback"]
