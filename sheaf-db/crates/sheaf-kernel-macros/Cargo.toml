# C-10 procedural macros for compile-time specialization of the native tiers.
# Timestamp: 2026-11-22_12-52-18 +05:30
# Remote: origin https://github.com/nithin12342/shelf-db.git
# Branch: combined-stack-feature-improvement

[package]
name = "sheaf-kernel-macros"
version = "0.1.0"
edition = "2021"
description = "Compile-time specialization attributes for the SheafDB native tiers"
license = "Apache-2.0"
publish = false

# This package is its own workspace root. The parent workspace file stays
# unchanged, and this crate does not become a member of it.
[workspace]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = { version = "2.0.119", features = ["full"] }
